<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Archive 2000-2025</title>
    <style>
        /* ベースのデザイン */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f3f3f3; color: #333; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #38003c; margin-bottom: 30px; }
        .intro { text-align: center; margin-bottom: 40px; color: #666; }

        /* グリッドレイアウト（カードを並べる） */
        .archive-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* カードのデザイン */
        .season-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border-top: 5px solid #38003c;
        }
        .season-card:hover { transform: translateY(-5px); }

        /* カードヘッダー */
        .card-header {
            background-color: #38003c;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .season-year { font-size: 1.2em; font-weight: bold; }
        .champion-badge { background-color: #00ff85; color: #38003c; padding: 5px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }

        /* カードの中身 */
        .card-body { padding: 20px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9em; border-bottom: 1px dotted #eee; padding-bottom: 5px; }
        .label { color: #888; font-size: 0.85em; }
        .value { font-weight: bold; text-align: right; }

        /* 詳細エリア（CL権やトリビア） */
        .details {
            background-color: #f9f9f9;
            padding: 15px;
            border-top: 1px solid #eee;
            display: none; /* 最初は隠す */
            font-size: 0.9em;
        }
        .details.open { display: block; animation: fadeIn 0.5s; }
        
        .trivia-box {
            margin-top: 10px;
            padding: 10px;
            background-color: #fff8e1; /* 薄い黄色 */
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 0.85em;
            line-height: 1.4;
        }

        /* ボタン */
        .toggle-btn {
            width: 100%;
            padding: 10px;
            background: none;
            border: none;
            border-top: 1px solid #eee;
            color: #38003c;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-btn:hover { background-color: #f0f0f0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

                /* 戻るボタン */
        .back-btn {
            display: inline-block;
            margin-top: 50px;
            background-color: #38003c;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
        .back-btn:hover { background-color: #00ff85; color: #38003c; }
    </style>
</head>

            detailDiv.classList.toggle('open');

            if (detailDiv.classList.contains('open')) {
